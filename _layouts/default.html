<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | Jinkun Cao</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/default.css">
  <link rel="shortcut icon" href="/static/cmu.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <!-- Navbar copied from your index.html -->
  <nav class="navbar navbar-expand-md navbar-light fixed-top bg-light" id="Home">
    <div class="container">
      <a class="navbar-brand" href="/index.html" style="margin-left: 20px;">Jinkun Cao (曹金坤)</a>
      <div class="collapse navbar-collapse" id="navbarToggle">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/misc.html">Misc</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/blog.html" style="color:black;text-decoration: underline;">Blog</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top:100px;">
    <div class="row">
      <!-- Main blog content -->
      <main class="col-md-9">
        {{ content }}
      </main>
  
      <!-- Tag sidebar -->
      <aside class="col-md-3">
        <div class="card" style="padding: 1rem;">
          <h5>📚 Tags</h5>
          <ul class="list-unstyled">
            {% assign sorted_tags = site.tags | sort %}
            {% for tag in sorted_tags %}
              <li><a href="/tags/{{ tag[0] | downcase }}/">{{ tag[0] }}</a></li>
            {% endfor %}
          </ul>
        </div>
      </aside>
    </div>
  </div>

</body>
</html>

---
layout: default
title: Blog
permalink: /blog.html
---

<h1>Blog</h1>
<p>Here I share thoughts, updates, or research ideas.</p>
<hr>

{% for post in site.posts %}
  <div class="post mb-4">
    <h4><a href="{{ post.url }}">{{ post.title }}</a></h4>
    <small>{{ post.date | date: "%B %d, %Y" }} · Tags: 
      {% for tag in post.tags %}
        <span class="badge badge-secondary">{{ tag }}</span>
      {% endfor %}
    </small>
    <p>{{ post.excerpt }}</p>
  </div>
{% endfor %}
